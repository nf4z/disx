name: disx

x-server: &server
    build:
        context: .
        target: server
        args:
            REVISION: ${REVISION:-}
            REVISION_TIME: ${REVISION_TIME:-0}
    image: disx-server:latest
    init: true

services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-larpcord}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-larpcord123}
            POSTGRES_DB: ${POSTGRES_DB:-larpcord}
        volumes:
            - postgres:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-larpcord} -d ${POSTGRES_DB:-larpcord}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    client:
        <<: *server
        command: ["client"]
        restart: "no"
        environment:
            CLIENT_CONCURRENCY: ${CLIENT_CONCURRENCY:-8}
        volumes:
            - client:/data/client

    sfu:
        build:
            context: .
            target: sfu
        image: disx-sfu:latest
        init: true
        restart: unless-stopped
        environment:
            WRTC_PUBLIC_IP: ${WRTC_PUBLIC_IP:-127.0.0.1}
            WRTC_PORT: ${WRTC_PORT:-50000}
            PION_SFU_VERBOSE: ${PION_SFU_VERBOSE:-}
        ports:
            - "${WRTC_PORT:-50000}:${WRTC_PORT:-50000}/udp"
        volumes:
            - sfu:/run/sfu
        healthcheck:
            test: ["CMD", "test", "-S", "/run/sfu/sfu.sock"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    server:
        <<: *server
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
            sfu:
                condition: service_healthy
            client:
                condition: service_completed_successfully
        environment:
            DATABASE: ${DOCKER_DATABASE:-postgres://${POSTGRES_USER:-larpcord}:${POSTGRES_PASSWORD:-larpcord123}@postgres:5432/${POSTGRES_DB:-larpcord}}
            DB_SSL: ${DB_SSL:-false}
            DOMAIN: ${DOMAIN:-larplite.xyz}
            PORT: "3001"
            CONFIG_PATH: "/data/state/config.json"
            JWT_KEY_DIR: "/data/state"
            INSTANCE_NAME: ${INSTANCE_NAME:-@lathandh}
            TRUSTED_PROXIES: ${TRUSTED_PROXIES:-true}
            WRTC_PUBLIC_IP: ${WRTC_PUBLIC_IP:-127.0.0.1}
            WRTC_PORT_MIN: ${WRTC_PORT:-50000}
            WRTC_PORT_MAX: ${WRTC_PORT:-50000}
            STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
            STORAGE_BUCKET: ${STORAGE_BUCKET:-}
            STORAGE_REGION: ${STORAGE_REGION:-}
            STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
            STORAGE_KEY_ID: ${STORAGE_KEY_ID:-}
            STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
            R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
            R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
            R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
            R2_BUCKET: ${R2_BUCKET:-}
            CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
            CLOUDFLARE_ACCESS_KEY_ID: ${CLOUDFLARE_ACCESS_KEY_ID:-}
            CLOUDFLARE_SECRET_ACCESS_KEY: ${CLOUDFLARE_SECRET_ACCESS_KEY:-}
            CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-}
            LOG_REQUESTS: ${LOG_REQUESTS:-500,501}
        ports:
            - "${SERVER_PORT:-3010}:3001"
        volumes:
            - state:/data/state
            - storage:/data/storage
            - client:/data/client
            - sfu:/run/sfu
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 2m

    tunnel:
        image: cloudflare/cloudflared:latest
        restart: unless-stopped
        command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN:-eyJhIjoiNTQyNTc0OTc5MGY1MGZhZDI3MmY1ODYyZjNiM2ExZWQiLCJ0IjoiYzY3ZmI4YTgtYWU0ZS00NWI1LThiMGItMzMwMDAwNWZmZGViIiwicyI6Ik5UQTFabVJsTURFdE1EbGxOQzAwWkRFMkxXRXpaVFV0TURKaE5EazFZak5rTVRFeCJ9}
        depends_on:
            server:
                condition: service_healthy

    # optional: starts only with the caddy profile (COMPOSE_PROFILES=caddy)
    caddy:
        image: caddy:2-alpine
        profiles: ["caddy"]
        restart: unless-stopped
        depends_on:
            server:
                condition: service_healthy
        environment:
            DOMAIN: ${DOMAIN:-larplite.xyz}
            CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        healthcheck:
            test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/config/"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 10s

volumes:
    postgres:
    state:
    storage:
    client:
    sfu:
    caddy_data:
    caddy_config:
